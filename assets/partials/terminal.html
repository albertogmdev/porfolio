<article class="window window--terminal" data-widget="terminal" aria-label="Terminal">
  <header class="window-bar">
    <span class="window-dots" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="window-name">terminal.sh</span>
    <span class="eva-mark eva-window-mark" lang="ja" aria-hidden="true" title="Terminal">端末</span>
  </header>
  <div class="window-body terminal-body">
    <div class="terminal-output" role="log" aria-label="Salida de la terminal" data-i18n-attr="aria-label:widgets.terminal.output" aria-live="polite" tabindex="0"></div>
    <form class="terminal-form" autocomplete="off">
      <label class="terminal-prompt" for="terminal-input">visitor@portfolio:/$</label>
      <textarea class="terminal-input" id="terminal-input" rows="1" wrap="soft" spellcheck="false" autocapitalize="none" autocomplete="off" autocorrect="off" enterkeyhint="send"></textarea>
    </form>
  </div>
</article>
